name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Test runtime-only suite (SciPy comparisons skip)
        run: python -m unittest discover -s tests -v
      - run: marginloom round examples/table.csv --contract examples/balanced.json --out smoke-report
      - run: marginloom verify examples/table.csv --contract examples/balanced.json --report smoke-report
  numerical:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        networkx: ['3.2', '3.7']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12'
      - run: python -m pip install . "networkx==${{ matrix.networkx }}" scipy
      - name: Test full suite including SciPy comparisons
        run: python -m unittest discover -s tests -v
